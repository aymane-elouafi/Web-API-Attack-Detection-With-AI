# WAF gateway demo stack.
#   cp .env.example .env && edit WAF_ADMIN_TOKEN
#   docker compose up --build -d                                        gateway + demo API + console
#   WAFGW_CORAZA_URL=http://coraza:8081 docker compose --profile coraza up --build -d    + Coraza+CRS as 6th detector
# client traffic -> http://localhost:8080   admin API -> 127.0.0.1:9000   console -> 127.0.0.1:8100
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  target:                      # intentionally vulnerable demo app: its port is never published
    build: { context: ., dockerfile: Dockerfile.gateway, target: target }
    <<: *hardening
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5

  coraza:                      # optional side-car: runs the OWASP CRS and only answers with its verdict headers
    profiles: ["coraza"]
    image: web-api-coraza:local
    build: { context: ./waf }
    <<: *hardening
    environment: { LISTEN: "0.0.0.0:8081", UPSTREAM: "http://target:8000", INSPECT_ONLY: "1" }
    expose: ["8081"]            # image is FROM scratch: no shell, so no healthcheck; the gateway fails open if it is down

  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway, target: gateway }
    image: wafgw:local
    <<: *hardening
    depends_on:
      target: { condition: service_healthy }
    environment:
      WAF_ADMIN_TOKEN: ${WAF_ADMIN_TOKEN:?set WAF_ADMIN_TOKEN in .env}
      WAFGW_UPSTREAM: http://target:8000
      WAFGW_ADMIN_LISTEN: 0.0.0.0:9000     # inside the container only; published to localhost below
      WAFGW_MODE: ${WAFGW_MODE:-monitor}   # monitor first, switch to block from the console when happy
      WAFGW_CORAZA_URL: ${WAFGW_CORAZA_URL:-}
    ports: ["${GATEWAY_PORT:-8080}:8080", "127.0.0.1:${ADMIN_PORT:-9000}:9000"]
    volumes: ["wafdata:/var/lib/wafgw", "wafmodels:/app/models"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5

  console:
    image: wafgw:local
    depends_on: [gateway]
    <<: *hardening
    command: ["python", "-m", "dashboard"]
    environment:
      WAF_ADMIN_TOKEN: ${WAF_ADMIN_TOKEN:?set WAF_ADMIN_TOKEN in .env}
      WAF_ADMIN_URL: http://gateway:9000
      CONSOLE_HOST: 0.0.0.0                # inside the container; the published port is localhost-only by default
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-}
    ports: ["${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-8100}:8100"]
    volumes: ["wafmodels:/app/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5

volumes:
  wafdata:
  wafmodels:
