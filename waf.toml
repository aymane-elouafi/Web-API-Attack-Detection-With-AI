# WAF gateway configuration. Every key is optional; these are the defaults.
# Env overrides: WAFGW_CONFIG (path), WAFGW_UPSTREAM, WAFGW_MODE, WAFGW_DB, WAFGW_ADMIN_LISTEN, WAFGW_TRUST_FORWARDED, WAF_ADMIN_TOKEN.

[proxy]
workers = 1   # >1: that many gateway processes on one port (see docs/PERFORMANCE.md for what they do not share)
listen = "0.0.0.0:8080"          # where clients connect
upstream = "http://127.0.0.1:8000"  # the application being protected
max_body_bytes = 1048576          # bigger request bodies get 413
inspect_bytes = 65536             # only the first N body bytes are analysed
upstream_timeout_s = 30
body_timeout_s = 30               # a client that sends its body slower than this gets 408 (slow-body attacks)
trust_forwarded = false           # true: take the client IP from X-Forwarded-For (only behind your own LB)

[tls]                             # optional TLS termination on the proxy port (both files, PEM)
cert = ""
key = ""

[engine]
mode = "monitor"                  # monitor = log only ("would_block"); block = answer 403
threshold = 0.5                   # fused risk (0-1) at which a request counts as an attack
on_error = "fail_open"            # engine crash: fail_open = forward anyway, fail_closed = 503

[admin]
listen = "127.0.0.1:9000"         # needs WAF_ADMIN_TOKEN in the environment, otherwise it is not started

[rate_limit]
enabled = false
rate_per_s = 20                   # sustained requests per second per client IP
burst = 40

[coraza]                          # optional 6th detector: Coraza+CRS side-car started with INSPECT_ONLY=1
enabled = false                   # (docker compose --profile coraza sets WAFGW_CORAZA_URL, which also enables it)
url = "http://127.0.0.1:8081"
timeout_s = 1.0                   # side-car too slow or down: the request is still judged by the other detectors

[response]                        # leak protection on what the application sends back (text/JSON only, bounded)
enabled = true
action = "alert"                  # alert = log only; redact = hide secrets/cards/keys; block = 502 page. Redact/block apply in block mode only
max_inspect_bytes = 65536         # only the first 64 KB of a response is buffered and scanned (worst case ~50 ms); bigger bodies keep streaming
types = ["text/", "application/json", "application/xml", "application/javascript"]

[honeypots]                       # paths answered by the gateway itself with fakes; a hit is a near-certain attacker
enabled = true
ban_minutes = 30                  # auto-ban the client IP (block mode only); 0 = never
canary = true                     # fake credentials in the honeypots; seeing one in a later request raises 'canary_used'
paths = ["/admin.bak", "/.env", "/.git/config", "/wp-login.php", "/phpmyadmin", "/api/internal", "/backup.sql"]

[store]
path = "data/waf.db"

[models]
dir = "models"                    # python -m wafgw.train writes payload.joblib and behavior.joblib here

# Per-route overrides (longest matching prefix wins): mode, threshold, disabled.
[[routes]]
prefix = "/health"
disabled = true

# [[routes]]
# prefix = "/login"
# mode = "block"
# threshold = 0.4

[reports]                         # scheduled security reports (HTML + JSON files); the console can also write one on demand
enabled = false
dir = "data/reports"
every_h = 24
window_h = 24                     # how far back each report looks
webhook = false                   # also send a summary to the alert webhook (console > Alerts)

[explainer]                       # OPTIONAL LLM narrative for incidents. Off by default; nothing is sent unless enabled = true.
enabled = false                   # Sends only computed facts (technique names, counts, outcome); never bodies, headers or full IPs.
url = ""                          # any OpenAI- or Anthropic-compatible endpoint, e.g. "http://127.0.0.1:20128" (a local gateway)
format = "openai"                 # openai | anthropic
model = ""
api_key_env = ""                  # NAME of the environment variable holding the key (the key itself never goes in this file)
timeout_s = 20
send_ip = false                   # true: send the full client IP instead of 203.0.113.x

[siem]            # ship events to a SIEM (both optional)
file = ""         # JSON lines, e.g. "data/siem.jsonl" (tail it with Filebeat / Splunk forwarder)
syslog = ""       # CEF over UDP syslog, e.g. "10.0.0.5:514"
only_flagged = true   # false = every request, not just blocked / would-block
